# Publishes the Firestore security rules and indexes on every push to main.
# The website itself is served by GitHub Pages.
# Optional: add the repository secret FIREBASE_SERVICE_ACCOUNT (JSON key of a service account in
# project alkohol-2ae09 with "Firebase Rules Admin" and "Cloud Datastore Index Admin").
# Without the secret the job is skipped; publish firestore.rules manually in the Firebase console.
name: Deploy Firestore rules

on:
  push:
    branches: [main]
    paths: [firestore.rules, firestore.indexes.json, firebase.json, .github/workflows/firebase-deploy.yml]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
    steps:
      - name: Skip without credentials
        if: env.SA == ''
        run: echo "::notice::FIREBASE_SERVICE_ACCOUNT not set - publish firestore.rules in the Firebase console."
      - uses: actions/checkout@v4
        if: env.SA != ''
      - uses: actions/setup-node@v4
        if: env.SA != ''
        with:
          node-version: 22
      - name: Deploy rules and indexes
        if: env.SA != ''
        run: |
          printf '%s' "$SA" > "$RUNNER_TEMP/sa.json"
          GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/sa.json" npx --yes firebase-tools@13 deploy --project alkohol-2ae09 --only firestore:rules,firestore:indexes --non-interactive
